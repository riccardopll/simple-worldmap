name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build

      - name: Install software renderer
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      # Loom runs the client inside xvfb-run when CI is set.
      - name: Run client game tests
        run: ./gradlew runClientGameTest
        timeout-minutes: 20

      - name: Upload game test output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: game-test-output
          path: |
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: simple-worldmap-0.1.${{ github.run_number }}
          path: build/libs/*.jar

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: simple-worldmap-0.1.${{ github.run_number }}
          path: libs

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.${{ github.run_number }}
        run: gh release create "$TAG" libs/*.jar --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
